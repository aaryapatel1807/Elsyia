[project]
name = "elysia-backend"
version = "0.1.0"
description = "Elysia AI Operating System - Backend API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Elysia Team"}
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "cryptography>=42.0.0",
    "pycaw>=20251023; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "playwright>=1.62.0; sys_platform == 'win32'",

    "pyyaml>=6.0.1",
    # AI/ML
    "faster-whisper>=0.10.0",
    "piper-tts>=1.2.0",
    # Ollama client
    "ollama>=0.1.0",
    # Google APIs: Gmail, Calendar, YouTube Data (Jev integrations)
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    # Jev wake word: on-device keyword spotting (openWakeWord) + mic capture
    "openwakeword>=0.6.0",
    "sounddevice>=0.4.6",
    # Jev dictation mode: type into the focused app (pynput keyboard injection)
    "pynput>=1.7.7",
    # Jev MCP client: community integrations via the Model Context Protocol
    "mcp>=1.0.0",
    # Jev ambient tools: live system stats (CPU/memory/disk)
    "psutil>=5.9.0",
    # Jev web tools: keyless metasearch + article extraction (no API keys)
    "ddgs>=9.0.0",
    "trafilatura>=2.0.0",
    # Jev reminders: native cross-platform desktop notifications
    "desktop-notifier>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[project.scripts]
elysia = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
