# Release Jev installers.
#
# Trigger: push a version tag, e.g.   git tag v0.2.0 && git push origin v0.2.0
# Each runner builds for its own OS (PyInstaller cannot cross-compile):
#   windows-latest -> jev-backend.exe + nsis installer
#   macos-latest   -> dmg
#   ubuntu-latest  -> AppImage
# Then a GitHub Release is created on the tag with all installers attached.
#
# Installers are unsigned (no paid certificates): Windows SmartScreen and
# macOS Gatekeeper will show a warning on first launch — documented in
# the README's Packaging section.

name: Release Jev installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release and upload installers

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set package.json version from tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const p = 'frontend/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('version set to', j.version);
          " "$TAG_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies + PyInstaller
        shell: bash
        run: |
          cd backend
          uv sync --frozen
          uv pip install pyinstaller

      - name: Freeze backend binary
        shell: bash
        run: |
          cd backend
          uv run --no-sync python -m PyInstaller --noconfirm --clean jev-backend.spec

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          npm ci

      - name: Build installer
        shell: bash
        run: |
          cd frontend
          npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: jev-${{ matrix.os }}
          path: |
            frontend/release/*.exe
            frontend/release/*.dmg
            frontend/release/*.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
